<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
.title{font-size:36px;font-weight:700}
.subtitle{font-size:20px;fill:#4b5563}
.gen{font-size:24px;font-weight:700}
.name{font-size:18px;font-weight:700}
.body{font-size:17px;fill:#374151}
.metric{font-size:19px;font-weight:700}
.arrow{stroke:#9ca3af;stroke-width:4;fill:none}
.card{fill:#ffffff;stroke:#d1d5db;stroke-width:2}
.cardCurrent{fill:#f3f4f6;stroke:#111827;stroke-width:3}
.badge{fill:#111827}
.badgeText{font-size:16px;font-weight:700;fill:#ffffff}
</style>
<text class="title" x="70" y="58">ZChain product evolution — six public generations</text>
<text class="subtitle" x="70" y="90">From a context-adaptive codec to a negotiated blockchain compression engine</text>

<path class="arrow" d="M270 365 H330 M500 365 H560 M730 365 H790 M960 365 H1020 M1190 365 H1250"/>

<rect class="card" x="50" y="170" width="220" height="390" rx="18"/>
<text class="gen" x="75" y="215">ZChain 3</text>
<text class="name" x="75" y="248">Foundation</text>
<text class="body" x="75" y="295">Original context-adaptive</text>
<text class="body" x="75" y="321">lossless codec.</text>
<text class="metric" x="75" y="385">74.27 MiB/s encode</text>
<text class="metric" x="75" y="415">67.96 MiB/s decode</text>
<text class="body" x="75" y="468">Public compatibility</text>
<text class="body" x="75" y="494">baseline.</text>

<rect class="card" x="280" y="170" width="220" height="390" rx="18"/>
<text class="gen" x="305" y="215">ZChain 4</text>
<text class="name" x="305" y="248">Fast Compatible</text>
<text class="body" x="305" y="295">Hot-path C optimization.</text>
<text class="body" x="305" y="321">Same tested v3 bytes.</text>
<text class="metric" x="305" y="385">113.36 MiB/s encode</text>
<text class="metric" x="305" y="415">1.53× vs v3</text>
<text class="body" x="305" y="468">Compatibility preserved</text>
<text class="body" x="305" y="494">on public corpus.</text>

<rect class="card" x="510" y="170" width="220" height="390" rx="18"/>
<text class="gen" x="535" y="215">ZChain 5</text>
<text class="name" x="535" y="248">Speed</text>
<text class="body" x="535" y="295">New speed-oriented stream.</text>
<text class="body" x="535" y="321">Lighter model + RAW bypass.</text>
<text class="metric" x="535" y="385">126.53 MiB/s encode</text>
<text class="metric" x="535" y="415">74.67 MiB/s decode</text>
<text class="body" x="535" y="468">Throughput-first profile.</text>

<rect class="card" x="740" y="170" width="220" height="390" rx="18"/>
<text class="gen" x="765" y="215">ZChain 6</text>
<text class="name" x="765" y="248">Blockchain</text>
<text class="body" x="765" y="295">First blockchain-specific</text>
<text class="body" x="765" y="321">routing and Ethereum hex</text>
<text class="body" x="765" y="347">specialization.</text>
<text class="metric" x="765" y="405">Structure ≠ crypto</text>
<text class="body" x="765" y="468">Established the need for</text>
<text class="body" x="765" y="494">negotiated payload models.</text>

<rect class="card" x="970" y="170" width="220" height="390" rx="18"/>
<text class="gen" x="995" y="215">ZChain 7</text>
<text class="name" x="995" y="248">Schema</text>
<text class="body" x="995" y="295">Runtime-assisted model:</text>
<text class="body" x="995" y="325">STRUCTURAL</text>
<text class="body" x="995" y="351">OPAQUE</text>
<text class="body" x="995" y="377">REFERENCES</text>
<text class="metric" x="995" y="430">No global scan</text>
<text class="body" x="995" y="480">Research architecture</text>
<text class="body" x="995" y="506">validated in microbenches.</text>

<rect class="cardCurrent" x="1200" y="150" width="250" height="430" rx="18"/>
<rect class="badge" x="1225" y="175" width="104" height="30" rx="15"/>
<text class="badgeText" x="1277" y="196" text-anchor="middle">CURRENT</text>
<text class="gen" x="1225" y="245">ZChain 8</text>
<text class="name" x="1225" y="278">Blockchain Engine</text>
<text class="body" x="1225" y="325">Negotiated models.</text>
<text class="body" x="1225" y="351">Stable C ABI + ZCB1.</text>
<text class="body" x="1225" y="377">CMake / pkg-config / install.</text>
<text class="body" x="1225" y="403">Multi-chain registry.</text>
<text class="metric" x="1225" y="458">Ethereum hex:</text>
<text class="metric" x="1225" y="487">146.12 MiB/s encode</text>
<text class="metric" x="1225" y="516">129.41 MiB/s decode</text>

<text class="subtitle" x="70" y="650">Public naming tracks product generations; historical engineering names remain preserved in detailed reports for traceability.</text>
<text class="subtitle" x="70" y="690">Performance figures are workload-specific. Schema microbenchmarks are research evidence, not production client throughput claims.</text>
</svg>