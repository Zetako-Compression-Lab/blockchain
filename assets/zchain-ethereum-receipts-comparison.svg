<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#555}.grid{stroke:#ddd;stroke-width:1}.axis{stroke:#555}.z{fill:#3fb37f}.other{fill:#8a8a8a}.label{font-size:12px}.value{font-size:12px;font-weight:700}.small{font-size:11px;fill:#555}</style>
<text class="title" x="70" y="32">Ethereum receipts — 1 MiB: compressed size vs encode speed</text>
<text class="sub" x="70" y="52">Selected comparison: ZChain Speed_First, gzip, Brotli, LZMA2/7zip</text>
<text class="small" x="70" y="82">Bars show final size in KB (lower is better); labels below show encode MiB/s.</text>
<line class="grid" x1="90" y1="390" x2="1040" y2="390"/><line class="grid" x1="90" y1="310" x2="1040" y2="310"/><line class="grid" x1="90" y1="230" x2="1040" y2="230"/><line class="grid" x1="90" y1="150" x2="1040" y2="150"/><line class="grid" x1="90" y1="70" x2="1040" y2="70"/>
<text class="label" x="80" y="394" text-anchor="end">0 KB</text><text class="label" x="80" y="314" text-anchor="end">20</text><text class="label" x="80" y="234" text-anchor="end">40</text><text class="label" x="80" y="154" text-anchor="end">60</text><text class="label" x="80" y="74" text-anchor="end">80</text>
<line class="axis" x1="90" y1="70" x2="90" y2="390"/><line class="axis" x1="90" y1="390" x2="1040" y2="390"/>
<rect class="z" x="130" y="216.7" width="90" height="173.3" rx="7"/><text class="value" x="175" y="207" text-anchor="middle">43.3 KB</text><text class="label" x="175" y="414" text-anchor="middle">ZChain Speed</text><text class="small" x="175" y="435" text-anchor="middle">170 MiB/s</text>
<rect class="other" x="260" y="92.7" width="90" height="297.3" rx="7"/><text class="value" x="305" y="83" text-anchor="middle">74.3 KB</text><text class="label" x="305" y="414" text-anchor="middle">gzip-1</text><text class="small" x="305" y="435" text-anchor="middle">446 MiB/s</text>
<rect class="other" x="390" y="144.0" width="90" height="246.0" rx="7"/><text class="value" x="435" y="134" text-anchor="middle">61.5 KB</text><text class="label" x="435" y="414" text-anchor="middle">gzip-6</text><text class="small" x="435" y="435" text-anchor="middle">185 MiB/s</text>
<rect class="other" x="520" y="204.1" width="90" height="185.9" rx="7"/><text class="value" x="565" y="194" text-anchor="middle">46.5 KB</text><text class="label" x="565" y="414" text-anchor="middle">Brotli q1</text><text class="small" x="565" y="435" text-anchor="middle">1279 MiB/s</text>
<rect class="other" x="650" y="220.9" width="90" height="169.1" rx="7"/><text class="value" x="695" y="211" text-anchor="middle">42.3 KB</text><text class="label" x="695" y="414" text-anchor="middle">Brotli q5</text><text class="small" x="695" y="435" text-anchor="middle">159 MiB/s</text>
<rect class="other" x="780" y="270.6" width="90" height="119.4" rx="7"/><text class="value" x="825" y="261" text-anchor="middle">29.8 KB</text><text class="label" x="825" y="414" text-anchor="middle">LZMA2 p1</text><text class="small" x="825" y="435" text-anchor="middle">101 MiB/s</text>
<rect class="other" x="910" y="214.5" width="90" height="175.5" rx="7"/><text class="value" x="955" y="205" text-anchor="middle">43.9 KB</text><text class="label" x="955" y="414" text-anchor="middle">LZMA2 p5</text><text class="small" x="955" y="435" text-anchor="middle">12.6 MiB/s</text>
<text class="small" x="70" y="485">Workload-specific benchmark. Lower final size is better; throughput is reported separately and should not be generalized to other payloads.</text>
</svg>